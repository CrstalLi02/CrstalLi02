<svg width="220" height="260" viewBox="0 0 220 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A small floating crystal spirit">
  <defs>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ecfeff"/><stop offset=".55" stop-color="#67e8f9"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="fr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#67e8f9" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .bob{animation:bob 3.6s ease-in-out infinite;transform-origin:110px 120px;}
      .shadow{animation:shadow 3.6s ease-in-out infinite;transform-origin:110px 236px;}
      .eye{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box;}
      .orbit{animation:spin 7s linear infinite;transform-origin:110px 118px;}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
      @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.75);opacity:.18}}
      @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){.bob,.shadow,.eye,.orbit{animation:none}}
    </style>
  </defs>
  <ellipse class="shadow" cx="110" cy="236" rx="46" ry="7" fill="#7c3aed" filter="url(#blur)"/>
  <g class="bob">
    <circle cx="110" cy="118" r="95" fill="url(#aura)"/>
    <!-- body: elongated octahedron -->
    <polygon points="110,22 70,100 110,206" fill="url(#fl)"/>
    <polygon points="110,22 150,100 110,206" fill="url(#fr)"/>
    <polyline points="70,100 110,118 150,100" fill="none" stroke="#e0f2fe" stroke-opacity=".55" stroke-width="1.5"/>
    <line x1="110" y1="22" x2="110" y2="206" stroke="#fff" stroke-opacity=".3"/>
    <!-- face -->
    <ellipse class="eye" cx="96" cy="132" rx="5" ry="8" fill="#0b0720"/>
    <ellipse class="eye" cx="124" cy="132" rx="5" ry="8" fill="#0b0720"/>
    <circle cx="98" cy="129" r="1.6" fill="#fff"/>
    <circle cx="126" cy="129" r="1.6" fill="#fff"/>
    <ellipse cx="86" cy="146" rx="6" ry="3" fill="#f0abfc" opacity=".55"/>
    <ellipse cx="134" cy="146" rx="6" ry="3" fill="#f0abfc" opacity=".55"/>
    <path d="M104 148 Q110 153 116 148" fill="none" stroke="#0b0720" stroke-width="2" stroke-linecap="round"/>
    <!-- sparkle on the tip -->
    <path d="M110 6 L113 16 L123 19 L113 22 L110 32 L107 22 L97 19 L107 16Z" fill="#fff">
      <animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g class="orbit">
    <rect x="22" y="114" width="9" height="9" transform="rotate(45 26.5 118.5)" fill="#a5f3fc"/>
    <rect x="190" y="114" width="7" height="7" transform="rotate(45 193.5 117.5)" fill="#c4b5fd"/>
    <circle cx="110" cy="28" r="0" fill="none"/>
  </g>
</svg>
